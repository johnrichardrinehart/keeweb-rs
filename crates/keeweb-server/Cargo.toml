[package]
name = "keeweb-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["John Rinehart"]
description = "Optional backend server for keeweb-rs"

# A workspace of its own, with its own Cargo.lock, so that the server and the
# local helper build only from this directory. Frontend changes do not change
# their Nix derivations.
[workspace]

[[bin]]
name = "keeweb-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
notify = "6"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
tracing = "0.1"
argon2 = { version = "0.6.0-rc.5", features = ["parallel"] }
base64 = "0.22"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
opt-level = 3    # Optimize for speed (important for Argon2 KDF)
codegen-units = 1  # Better optimization at cost of compile time
